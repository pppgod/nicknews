[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nicknews"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "apscheduler",
    "python-dotenv",
    "yfinance",
    "feedparser",
    "holidays",
]

[project.scripts]
nicknews = "nicknews.bot:main"

[project.optional-dependencies]
dev = ["ruff", "pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=src/nicknews --cov-report=term-missing --cov-fail-under=70"
